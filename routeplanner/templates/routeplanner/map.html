{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuel-Optimal Route Planner</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root {
    --bg: #0f1419;
    --panel: #171d26;
    --panel-2: #1f2733;
    --line: #2b3542;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #3fb950;
    --accent-dim: #2ea043;
    --warn: #d29922;
    --danger: #f85149;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex; background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #sidebar {
    width: 390px; min-width: 390px; height: 100vh; overflow-y: auto;
    background: var(--panel); border-right: 1px solid var(--line); padding: 20px;
  }
  h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: -0.2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
          color: var(--muted); margin: 12px 0 5px; }
  input {
    width: 100%; padding: 9px 11px; border-radius: 7px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--accent-dim); }
  .row { display: flex; gap: 10px; }
  button {
    width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 7px;
    background: var(--accent-dim); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: var(--accent); }
  button:disabled { opacity: .55; cursor: progress; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 18px 0 8px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 9px; padding: 11px 12px; }
  .card .k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .card .v { font-size: 19px; font-weight: 650; margin-top: 3px; letter-spacing: -0.3px; }
  .card .v.green { color: var(--accent); }
  .stop {
    display: flex; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--line);
  }
  .stop:last-child { border-bottom: 0; }
  .badge {
    flex: 0 0 24px; height: 24px; border-radius: 50%; background: var(--accent-dim);
    color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center;
  }
  .stop .name { font-weight: 600; font-size: 13px; }
  .stop .meta { color: var(--muted); font-size: 12px; }
  .price { margin-left: auto; text-align: right; font-size: 13px; white-space: nowrap; }
  .price b { color: var(--accent); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
       margin: 22px 0 4px; }
  #map { flex: 1; height: 100vh; }
  .msg { padding: 11px 12px; border-radius: 8px; font-size: 13px; margin-top: 14px; }
  .msg.error { background: rgba(248,81,73,.12); border: 1px solid rgba(248,81,73,.35); color: #ffb3ae; }
  .msg.warn { background: rgba(210,153,34,.12); border: 1px solid rgba(210,153,34,.3); color: #e3c07b; }
  .foot { color: var(--muted); font-size: 11px; margin-top: 18px; line-height: 1.6; }
  .foot code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; }
  .leaflet-popup-content { font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .pin {
    width: 26px; height: 26px; border-radius: 50%; background: #2ea043; color: #fff;
    border: 2px solid #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700;
    box-shadow: 0 1px 4px rgba(0,0,0,.5);
  }
  .pin.end { background: #1f6feb; }
  @media (max-width: 820px) {
    body { flex-direction: column; height: auto; }
    #sidebar { width: 100%; min-width: 0; height: auto; }
    #map { height: 65vh; }
  }
</style>
</head>
<body>
<div id="sidebar">
  <h1>Fuel-Optimal Route Planner</h1>
  <div class="sub">Cheapest way to fuel a 500-mile-range, 10&nbsp;mpg truck across the USA.</div>

  <label for="start">Start</label>
  <input id="start" value="{{ start }}" placeholder="Dallas, TX">
  <label for="finish">Finish</label>
  <input id="finish" value="{{ finish }}" placeholder="New York, NY">
  <div class="row">
    <div style="flex:1"><label for="mpg">MPG</label><input id="mpg" value="{{ mpg }}"></div>
    <div style="flex:1"><label for="range">Range (mi)</label><input id="range" value="{{ range_miles }}"></div>
    <div style="flex:1"><label for="penalty">$ per stop</label><input id="penalty" value="{{ stop_penalty }}"></div>
  </div>
  <button id="go">Plan route</button>

  <div id="messages"></div>
  <div id="summary"></div>
  <div id="stops"></div>

  <div class="foot">
    Same data as <code>GET /api/v1/route/</code>. Prices from the OPIS truck stop file;
    stations are placed at city centroids, so a stop may sit a few miles off the line.
  </div>
</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const map = L.map('map', { zoomControl: true }).setView([39.5, -98.35], 4);
// OpenStreetMap's standard tiles: free, no API key, attribution required.
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
  maxZoom: 19
}).addTo(map);

let layer = L.layerGroup().addTo(map);
const $ = (id) => document.getElementById(id);
const money = (n) => '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

function pin(label, cls) {
  return L.divIcon({ className: '', html: `<div class="pin ${cls || ''}">${label}</div>`,
                     iconSize: [26, 26], iconAnchor: [13, 13] });
}

function render(data) {
  layer.clearLayers();

  const line = data.route.geometry.coordinates.map(c => [c[1], c[0]]);
  const path = L.polyline(line, { color: '#1f6feb', weight: 5, opacity: .85 }).addTo(layer);

  L.marker([data.start.latitude, data.start.longitude], { icon: pin('A') })
    .bindPopup(`<b>Start</b><br>${data.start.query}`).addTo(layer);
  L.marker([data.finish.latitude, data.finish.longitude], { icon: pin('B', 'end') })
    .bindPopup(`<b>Finish</b><br>${data.finish.query}`).addTo(layer);

  data.fuel_stops.forEach(stop => {
    if (stop.latitude === null) return;
    L.marker([stop.latitude, stop.longitude], { icon: pin(stop.sequence) })
      .bindPopup(
        `<b>${stop.name}</b><br>${stop.city}, ${stop.state}` +
        `<br>$${stop.price_per_gallon.toFixed(3)}/gal` +
        `<br>${stop.gallons.toFixed(1)} gal &rarr; <b>${money(stop.cost)}</b>` +
        `<br><span style="color:#777">mile ${stop.mile_marker} &middot; ${stop.detour_miles} mi off route</span>`
      ).addTo(layer);
  });

  map.fitBounds(path.getBounds(), { padding: [40, 40] });

  const t = data.totals;
  $('summary').innerHTML = `
    <div class="cards">
      <div class="card"><div class="k">Total fuel cost</div><div class="v green">${money(t.fuel_cost)}</div></div>
      <div class="card"><div class="k">Distance</div><div class="v">${data.route.distance_miles.toLocaleString()} mi</div></div>
      <div class="card"><div class="k">Fuel stops</div><div class="v">${t.stops}</div></div>
      <div class="card"><div class="k">Gallons</div><div class="v">${t.gallons.toFixed(1)}</div></div>
      <div class="card"><div class="k">Avg price paid</div><div class="v">$${t.average_price_paid.toFixed(3)}</div></div>
      <div class="card"><div class="k">Saved vs avg price</div><div class="v green">${money(t.savings_vs_national_average)}</div></div>
    </div>
    ${tradeoff(data)}
    <div class="foot" style="margin-top:2px">
      ${data.route.duration_hours.toFixed(1)} h driving &middot; ${data.meta.stations_considered}
      stations within ${data.meta.max_detour_miles} mi of the route &middot;
      ${data.meta.external_api_calls} external API call(s) &middot;
      ${data.meta.cached ? 'served from cache' : 'computed'} in ${data.meta.compute_ms} ms
    </div>`;

  $('stops').innerHTML = '<h2>Fuel stops</h2>' + (data.fuel_stops.length ? data.fuel_stops.map(s => `
    <div class="stop">
      <div class="badge">${s.sequence}</div>
      <div>
        <div class="name">${s.name}</div>
        <div class="meta">${s.city}, ${s.state} &middot; mile ${s.mile_marker}${s.is_origin_fill ? ' &middot; initial tank' : ''}</div>
      </div>
      <div class="price">$${s.price_per_gallon.toFixed(3)}/gal<br><b>${money(s.cost)}</b></div>
    </div>`).join('') : '<div class="meta">No fuel stops needed.</div>');
}

function tradeoff(data) {
  const o = data.optimization || {};
  const cheapest = o.cheapest_fuel_only_plan;
  if (!cheapest || cheapest.stops <= data.totals.stops) return '';
  return `<div class="foot" style="margin:0 0 6px">
    Cheapest fuel regardless of stops: ${money(cheapest.fuel_cost)} over ${cheapest.stops} stops.
    This plan spends ${money(o.extra_fuel_cost_for_fewer_stops)} more to make
    ${cheapest.stops - data.totals.stops} fewer (each stop priced at ${money(o.stop_penalty)} plus its detour).
  </div>`;
}

function message(html, kind) {
  $('messages').innerHTML = html ? `<div class="msg ${kind}">${html}</div>` : '';
}

async function plan() {
  const button = $('go');
  button.disabled = true;
  button.textContent = 'Planning…';
  message('');
  const params = new URLSearchParams({
    start: $('start').value, finish: $('finish').value,
    mpg: $('mpg').value, range_miles: $('range').value, stop_penalty: $('penalty').value
  });
  // Carry over the other plan parameters from map_url, so this page draws the
  // exact plan the API returned.
  const current = new URLSearchParams(window.location.search);
  ['max_detour_miles', 'start_fuel_gallons'].forEach(key => {
    if (current.has(key)) params.set(key, current.get(key));
  });
  try {
    const response = await fetch(`/api/v1/route/?${params}`, { headers: { Accept: 'application/json' } });
    const data = await response.json();
    if (!response.ok) {
      message(`<b>${data.error || 'Error'}</b><br>${data.detail || JSON.stringify(data)}`, 'error');
      $('summary').innerHTML = ''; $('stops').innerHTML = '';
      return;
    }
    render(data);
    if (data.meta.warnings && data.meta.warnings.length) {
      message(data.meta.warnings.join('<br>'), 'warn');
    }
    const url = new URL(window.location);
    url.search = params.toString();
    history.replaceState({}, '', url);
  } catch (error) {
    message('Request failed: ' + error, 'error');
  } finally {
    button.disabled = false;
    button.textContent = 'Plan route';
  }
}

$('go').addEventListener('click', plan);
document.querySelectorAll('input').forEach(input =>
  input.addEventListener('keydown', e => { if (e.key === 'Enter') plan(); }));
{% if autorun %}plan();{% endif %}
</script>
</body>
</html>
